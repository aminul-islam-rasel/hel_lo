name: hel_lo
description: "A complete professional WhatsApp-like messaging app built with Flutter and Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_webrtc: ^0.11.6
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.1
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.4.0
  permission_handler: ^11.3.1
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  emoji_picker_flutter: ^4.5.4
  photo_view: ^0.15.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  flutter_contacts: ^1.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/logo/

flutter_launcher_icons:
  image_path: "assets/logo/app_logo.jpg"
  android: true
  ios: true
